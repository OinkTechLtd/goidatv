<!DOCTYPE html>
<html lang="ru">
<body>
    <h1>Документация T2000</h1>
    <p>Сервис позволяет использовать GitHub/GitVerse как CDN.</p>
    <h2>Формат ссылок:</h2>
    <code>/proxy/:platform/:user/:repo/:branch/:path</code>
    <ul>
        <li><b>platform:</b> github или gitverse</li>
        <li><b>user:</b> имя владельца</li>
        <li><b>repo:</b> имя репозитория</li>
        <li><b>branch:</b> ветка (main/master)</li>
    </ul>
</body>
</html>
